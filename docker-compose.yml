version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: impacthub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: impactuser
      POSTGRES_PASSWORD: impactpassword
      POSTGRES_DB: impacthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impactuser -d impacthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: impacthub_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://impactuser:impactpassword@postgres:5432/impacthub?schema=public
      - JWT_ACCESS_SECRET=impacthub_access_jwt_production_secret_key_2026_super_secure
      - JWT_REFRESH_SECRET=impacthub_refresh_jwt_production_secret_key_2026_super_secure
      - COOKIE_SECRET=impacthub_cookie_signing_secret_key_2026_super_secure
      - BASE_URL=http://localhost:5000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local

